<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fossilite AI</title>
    <!-- GitHub Pages has no server-side SPA fallback: any unknown path (deep
         link or refresh) serves this file. It encodes the requested path into a
         query string and redirects to the app root, where the decode snippet in
         index.html restores it and hands off to the router.
         pathSegmentsToKeep = 1 keeps the /fossilite-website/ project base. -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <link rel="icon" type="image/svg+xml" href="/fossilite-website/FossiliteLogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/fossilite-website/assets/index-DOGZAOMz.js"></script>
  </body>
</html>
