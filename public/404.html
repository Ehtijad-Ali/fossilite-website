<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fossilite AI</title>
    <!-- GitHub Pages has no server-side SPA fallback: any unknown path (deep
         link or refresh) serves this file. It encodes the requested path into a
         query string and redirects to the app root, where the decode snippet in
         index.html restores it and hands off to the router.
         pathSegmentsToKeep = 1 keeps the /fossilite-website/ project base. -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
