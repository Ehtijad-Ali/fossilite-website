<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fossilite AI</title>
    <script type="text/javascript">
      // Redirect to index.html with the path encoded in the query string
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      if (newUrl !== l.href) {
        l.replace(newUrl);
      }
    </script>
  </head>
  <body>
    <!-- If JavaScript is disabled, show a message -->
    <noscript>
      <p style="text-align: center; padding: 20px; font-family: sans-serif;">
        Please enable JavaScript to view this site.
      </p>
    </noscript>
  </body>
</html>
